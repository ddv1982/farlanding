name: CI

# One run per change: branches are checked through their pull request, main on push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      broad:
        description: Run every mission in Chromium
        type: boolean
        default: false
      audio:
        description: Run the full real-mixer audio suite in Chromium
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  GODOT_ZIP: Godot_v4.7.2-stable_linux.x86_64.zip
  # From https://github.com/godotengine/godot/releases/download/4.7.2-stable/SHA512-SUMS.txt
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64-${{ env.GODOT_SHA512 }}

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL --retry 3 --connect-timeout 30 --max-time 300 -o "$RUNNER_TEMP/$GODOT_ZIP" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_ZIP}"
          echo "$GODOT_SHA512  $RUNNER_TEMP/$GODOT_ZIP" | sha512sum --check
          unzip -q "$RUNNER_TEMP/$GODOT_ZIP" -d ~/godot
          mv "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot/godot"
          chmod +x ~/godot/godot

      - name: Run checks
        run: |
          export GODOT="$HOME/godot/godot"
          "$GODOT" --version
          tools/check.sh

  web:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64-${{ env.GODOT_SHA512 }}

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL --retry 3 --connect-timeout 30 --max-time 300 -o "$RUNNER_TEMP/$GODOT_ZIP" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_ZIP}"
          echo "$GODOT_SHA512  $RUNNER_TEMP/$GODOT_ZIP" | sha512sum --check
          unzip -q "$RUNNER_TEMP/$GODOT_ZIP" -d ~/godot
          mv "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot/godot"
          chmod +x ~/godot/godot

      - name: Cache Web export templates
        id: template-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: templates-web-4.7.2-${{ hashFiles('tools/install_godot_templates.sh') }}

      - name: Install verified Web templates
        if: steps.template-cache.outputs.cache-hit != 'true'
        run: tools/install_godot_templates.sh

      - name: Verify Web tooling
        run: |
          python3 -m unittest discover -s tools -p test_web_tools.py
          python3 -m unittest discover -s tools -p test_vercel_deploy.py

      - name: Export browser bundles
        timeout-minutes: 30
        env:
          GODOT: /home/runner/godot/godot
        run: |
          tools/export.sh Web WebDiagnostics
          python3 tools/web_manifest.py build/web --verify
          python3 tools/web_manifest.py build/web-diagnostics --verify

      - name: Upload playable browser artifact
        uses: actions/upload-artifact@v6
        with:
          name: farlanding-web-${{ github.sha }}
          overwrite: true
          path: |
            build/web/
            tools/serve_web.py
            tools/web_manifest.py
          if-no-files-found: error
          retention-days: 14

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tools/web_tests/package-lock.json

      - name: Install browser test tools
        working-directory: tools/web_tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser gameplay
        working-directory: tools/web_tests
        timeout-minutes: 30
        run: npm test

      - name: Every mission in browser
        if: github.event_name == 'workflow_dispatch' && inputs.broad
        working-directory: tools/web_tests
        timeout-minutes: 30
        env:
          WEB_BROAD: '1'
        run: npm test

      - name: Full browser audio qualification
        if: github.event_name == 'workflow_dispatch' && inputs.audio
        working-directory: tools/web_tests
        timeout-minutes: 15
        env:
          WEB_AUDIO_QA: '1'
        run: npm test -- --grep real-mixer

      - name: Upload browser evidence and export logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: farlanding-web-evidence-${{ github.sha }}
          overwrite: true
          path: |
            build/logs/
            tools/web_tests/test-results/
            tools/web_tests/playwright-report/
          if-no-files-found: warn
          retention-days: 14

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    environment:
      name: production
      url: ${{ vars.VERCEL_PRODUCTION_URL }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tools/web_tests/package-lock.json

      - name: Prepare the tested release for Vercel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/prepare_vercel.py --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --commit "$GITHUB_SHA"

      - name: Pull Vercel environment information
        run: npx --yes vercel@65.16.0 pull --cwd .vercel-source --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build the tested artifact on Vercel
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx --yes vercel@65.16.0 deploy --cwd .vercel-source --yes --prod --skip-domain \
            --build-env "GH_TOKEN=$GH_TOKEN" --json --token="$VERCEL_TOKEN" > "$RUNNER_TEMP/deployment.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from tools.prepare_vercel import deployment_url
          response = json.loads((Path(os.environ['RUNNER_TEMP']) / 'deployment.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('url=' + deployment_url(response) + '\n')
          PY

      - name: Install hosted browser test runtime
        working-directory: tools/web_tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify the staged game before promotion
        working-directory: tools/web_tests
        env:
          WEB_DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
          WEB_DEPLOYMENT_COMMIT: ${{ github.sha }}
          WEB_DEPLOYMENT_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test --config playwright.deployment.config.cjs

      - name: Promote production
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: npx --yes vercel@65.16.0 promote "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"

      - name: Verify the public production domain
        working-directory: tools/web_tests
        env:
          WEB_DEPLOYMENT_URL: ${{ vars.VERCEL_PRODUCTION_URL }}
          WEB_DEPLOYMENT_COMMIT: ${{ github.sha }}
          WEB_DEPLOYMENT_PUBLIC_ONLY: '1'
        run: npx playwright test --config playwright.deployment.config.cjs

      - name: Upload hosted browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: farlanding-production-evidence-${{ github.sha }}
          overwrite: true
          path: |
            tools/web_tests/test-results/
            tools/web_tests/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
